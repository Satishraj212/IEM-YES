<svg xmlns="http://www.w3.org/2000/svg" width="360" height="680" viewBox="0 0 360 680" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- ── edges ── -->
  <g stroke="#222" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <!-- main chain -->
    <line x1="200" y1="62"  x2="200" y2="88"/>
    <line x1="200" y1="132" x2="200" y2="158"/>
    <line x1="200" y1="202" x2="200" y2="228"/>
    <line x1="200" y1="272" x2="200" y2="298"/>
    <!-- decision -> save (valid) -->
    <line x1="200" y1="342" x2="200" y2="388"/>
    <line x1="200" y1="432" x2="200" y2="458"/>
    <line x1="200" y1="502" x2="200" y2="528"/>
    <line x1="200" y1="572" x2="200" y2="598"/>
    <!-- decision -> error (invalid) -->
    <line x1="184.5" y1="335.5" x2="125.5" y2="394.5"/>
    <!-- error -> back to "Enter Details" (loop) -->
    <path d="M 94.5,394.5 C 40,340 40,210 178,180"/>
  </g>

  <!-- branch labels -->
  <text x="212" y="372" font-size="11" fill="#1a6b3c">Yes</text>
  <text x="138" y="360" font-size="11" fill="#c0392b">No</text>

  <!-- ── nodes ── -->
  <g fill="#fff" stroke="#222" stroke-width="1.6">
    <circle cx="200" cy="40"  r="22"/>
    <circle cx="200" cy="110" r="22"/>
    <circle cx="200" cy="180" r="22"/>
    <circle cx="200" cy="250" r="22"/>
    <circle cx="200" cy="320" r="22"/>
    <circle cx="110" cy="410" r="22"/>
    <circle cx="200" cy="410" r="22"/>
    <circle cx="200" cy="480" r="22"/>
    <circle cx="200" cy="550" r="22"/>
    <circle cx="200" cy="620" r="22"/>
  </g>
  <g fill="#001f45" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="200" y="46">1</text>
    <text x="200" y="116">2</text>
    <text x="200" y="186">3</text>
    <text x="200" y="256">4</text>
    <text x="200" y="326">5</text>
    <text x="110" y="416">6</text>
    <text x="200" y="416">7</text>
    <text x="200" y="486">8</text>
    <text x="200" y="556">9</text>
    <text x="200" y="626">10</text>
  </g>
</svg>
